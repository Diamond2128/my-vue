<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vue App Test</title>
    <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h1>{{ message }}</h1>
        <p>如果你看到这个消息，说明Vue正常工作</p>
        <p>当前时间: {{ currentTime }}</p>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                message: 'Vue应用测试成功！',
                currentTime: new Date().toLocaleString()
            },
            mounted() {
                setInterval(() => {
                    this.currentTime = new Date().toLocaleString();
                }, 1000);
            }
        });
    </script>
</body>
</html>
